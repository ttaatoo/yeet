name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck website
        working-directory: web
        run: bun run typecheck

      - name: Build website
        working-directory: web
        run: bun run build

  macos:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: |
          set -euo pipefail
          echo "DEVELOPER_DIR=$(xcode-select -p)"
          xcodebuild -version
          python3 -c "
          import pathlib
          text = pathlib.Path('yeet.xcodeproj/project.pbxproj').read_text()
          if 'objectVersion = 77' not in text:
              raise SystemExit('yeet.xcodeproj must stay at objectVersion 77 (Xcode 16 format)')
          "

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Test
        run: |
          set -euo pipefail
          xcodebuild test \
            -project yeet.xcodeproj \
            -scheme yeet \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -resultBundlePath "$RUNNER_TEMP/yeet-tests.xcresult" \
            -skipMacroValidation \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            CLANG_COVERAGE_MAPPING=NO \
            CLANG_ENABLE_CODE_COVERAGE=NO \
            ENABLE_CODE_COVERAGE=NO

      - name: Show test failures
        if: failure()
        run: |
          if [ -d "$RUNNER_TEMP/yeet-tests.xcresult" ]; then
            xcrun xcresulttool get test-results summary \
              --path "$RUNNER_TEMP/yeet-tests.xcresult"
          fi

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-test-results
          path: ${{ runner.temp }}/yeet-tests.xcresult
          if-no-files-found: ignore
          retention-days: 7

      - name: Build Release resource benchmark
        run: bash scripts/package.sh

      - name: Check Release startup resources
        run: bash scripts/bench-startup-resources.sh dist/Yeet.app
