name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish (for example v0.1.47). Created if missing."
        required: true
        default: "v0.1.47"
        type: string

permissions:
  contents: write

jobs:
  release:
    # kero.xcodeproj is objectVersion 110 / LastUpgradeCheck 2700 /
    # CreatedOnToolsVersion 27.0. macos-26 only ships Xcode 26.0.1–26.6
    # (default 26.6); run 32471771040 failed in ~3s with xcodebuild
    # exit 74: "future Xcode project file format (110)". The xcode-27
    # public-preview image (2026-07-16) defaults to Xcode 27.0 and
    # /Applications/Xcode.app already points at 27. macos-26 does not
    # include Xcode 27.
    # https://github.blog/changelog/2026-07-16-xcode-27-runner-image-now-in-public-preview/
    # https://github.com/actions/runner-images/issues/14404
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show Xcode
        run: |
          set -euo pipefail
          echo "DEVELOPER_DIR=$(xcode-select -p)"
          xcodebuild -version

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build ad-hoc signed app
        run: bash scripts/package.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="$INPUT_TAG"
          elif [[ "$REF_TYPE" == "tag" ]]; then
            TAG="$REF_NAME"
          else
            echo "No tag to publish" >&2
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v ]]; then
            echo "Refusing to publish a non-v* tag: $TAG" >&2
            exit 1
          fi
          if [[ ! -f dist/Kero.zip ]]; then
            echo "dist/Kero.zip was not produced" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes --target "$TARGET_SHA"
          fi
          gh release upload "$TAG" "dist/Kero.zip#Kero.zip" --clobber
