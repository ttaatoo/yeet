name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish (for example v0.1.50). Created if missing."
        required: true
        default: "v0.1.50"
        type: string

permissions:
  contents: write

jobs:
  release:
    # yeet.xcodeproj stays on Xcode 16 project format (objectVersion 77)
    # so Xcode 26.5 can open it. macos-26 ships Xcode 26.x (default 26.6).
    # Do not accept an Xcode 27 upgrade that writes format 110.
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show Xcode
        run: |
          set -euo pipefail
          echo "DEVELOPER_DIR=$(xcode-select -p)"
          xcodebuild -version

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Build ad-hoc signed app
        run: bash scripts/package.sh

      - name: Resolve tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="$INPUT_TAG"
          elif [[ "$REF_TYPE" == "tag" ]]; then
            TAG="$REF_NAME"
          else
            echo "No tag to publish" >&2
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v ]]; then
            echo "Refusing to publish a non-v* tag: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Release notes from CHANGELOG
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          bun -e '
            import { extractReleaseNotes } from "./scripts/changelog.ts";
            const version = process.env.VERSION ?? "";
            const notes = extractReleaseNotes(await Bun.file("CHANGELOG.md").text(), version);
            const body = notes?.trim()
              ? `${notes.trim()}\n`
              : `See CHANGELOG.md for ${version}.\n`;
            await Bun.write("release-notes.md", body);
          '

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! -f dist/Yeet.zip ]]; then
            echo "dist/Yeet.zip was not produced" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --target "$TARGET_SHA"
          fi
          gh release upload "$TAG" "dist/Yeet.zip#Yeet.zip"

      - name: Pin Homebrew tap on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          bun scripts/pin-homebrew.ts "$VERSION" dist/Yeet.zip
          cp Casks/yeet.rb "${RUNNER_TEMP}/yeet.cask.rb"
          cp Formula/yeet.rb "${RUNNER_TEMP}/yeet.formula.rb"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout --force origin/main
          cp "${RUNNER_TEMP}/yeet.cask.rb" Casks/yeet.rb
          cp "${RUNNER_TEMP}/yeet.formula.rb" Formula/yeet.rb
          git add Casks/yeet.rb Formula/yeet.rb
          if git diff --cached --quiet; then
            echo "Homebrew pins already match"
            exit 0
          fi
          git commit -m "chore: pin homebrew to v${VERSION}"
          git push origin HEAD:main
